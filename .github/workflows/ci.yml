name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # registry/ is what the shadcn CLI reads from GitHub, so it must match the source.
      - name: Registry is up to date
        run: |
          pnpm registry:build
          if [ -n "$(git status --porcelain -- registry registry.json)" ]; then
            git status --short -- registry registry.json
            echo "::error::registry/ is out of date. Run 'pnpm registry:build' and commit the result."
            exit 1
          fi

      - run: pnpm registry:validate

      # Every component has a doc for llms.txt, and every example in the docs typechecks
      - name: Agent docs
        run: |
          pnpm llms:check
          pnpm llms:build --out "$RUNNER_TEMP/llms"

      - name: Build Storybook
        run: pnpm --filter @mof-malaysia/ftds-storybook build

      - name: Build docs
        run: pnpm --filter @mof-malaysia/ftds-docs-astro build

      # The playground Worker: its checks, the preview page and a bundle (no deploy)
      - name: Playground
        run: |
          pnpm --filter @mof-malaysia/ftds-mcp test
          pnpm --filter @mof-malaysia/ftds-mcp build
