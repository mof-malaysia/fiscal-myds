name: Release

# Trunk-based release: tag a commit on main as v<version>.
#
# The tag points at a release commit on top of main that only pins every
# registryDependency to the tag (mof-malaysia/ftds/utils#v2.1.0), because
# shadcn does not pass a ref on to dependencies. main itself stays unpinned.
# Pages is then redeployed so r/<tag>/, r/v<major>/ and r/latest/ pick it up.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the v (2.1.0, or 2.2.0-rc.1 for a prerelease)
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run the release from main."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a version like 2.1.0 or 2.2.0-rc.1."
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tag must be new
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::$TAG already exists. Tags are permanent; release a new version instead."
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build registry pinned to the tag
        env:
          FTDS_REF: ${{ steps.version.outputs.tag }}
        run: pnpm registry:build

      - run: pnpm registry:validate

      - name: Commit and push the tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry registry.json
          git commit --no-verify -m "release: $TAG"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" \
            ${PRERELEASE:+--prerelease}

  pages:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
