# Git hooks, installed by `pnpm install` (the `prepare` script runs `lefthook install`).
# They replace CI: commits get the fast checks, pushes get the rest.
# Skip once in an emergency with `LEFTHOOK=0 git commit ...` or `LEFTHOOK=0 git push ...`.
pre-commit:
  parallel: true
  skip:
    - merge
    - rebase
  commands:
    format:
      glob: "*.{ts,tsx,md}"
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
    lint:
      run: pnpm lint
    typecheck:
      run: pnpm typecheck

# Checks the working tree, so commit or stash other changes before pushing.
pre-push:
  jobs:
    # registry/ is what the shadcn CLI reads from GitHub, so it must match the source
    - name: registry is up to date
      run: |
        pnpm registry:build
        if [ -n "$(git status --porcelain -- registry registry.json)" ]; then
          git status --short -- registry registry.json
          echo "registry/ is out of date. Commit the result of 'pnpm registry:build'."
          exit 1
        fi
    - name: registry validates
      run: pnpm registry:validate
    # Every component has a doc for llms.txt, and every example in the docs typechecks
    - name: agent docs
      run: pnpm llms:check
    # Builds and tests through turbo, so a package whose sources (and the
    # workspace packages it uses) haven't changed replays from the cache. The
    # four builds run in parallel; the Astro axe and keyboard tests start once
    # the Astro Storybook is built. Clear the cache with `rm -rf .turbo/cache`.
    # (First time: `pnpm --filter @mof-malaysia/ftds-storybook-astro exec playwright install chromium`)
    - name: builds and tests
      run: >-
        pnpm exec turbo run build test --ui=stream --output-logs=errors-only
        --filter=@mof-malaysia/ftds-storybook
        --filter=@mof-malaysia/ftds-storybook-astro
        --filter=@mof-malaysia/ftds-docs-astro
        --filter=@mof-malaysia/ftds-mcp
